<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediVault — Health Records System</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  >

  <!-- MediVault Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Speech recognition for voice commands -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/speech-recognition/1.0.0/speech-recognition.min.js"></script>

  <!-- Speech synthesis polyfill for voice responses -->
  <script src="https://cdn.jsdelivr.net/npm/speech-synthesis-polyfill@1.0.0/dist/speech-synthesis-polyfill.min.js"></script>

<body>

  <!-- Root mount point — all UI is injected here by app.js -->
  <div id="root"></div>

  <!--
    Script load order matters:
      1. db.js            — data store (must be first, referenced by everything)
      2. icons.js         — SVG helpers (referenced by app shell renderer)
      3. api.js           — API client (required before auth.js)
      4. auth.js          — login / register (references API, render, v)
      5. modals.js        — modal renderers & save actions (references DB, state)
      6. pages-patient.js — patient page renderers (references DB, state, helpers)
      7. pages-doctor.js  — doctor page renderers (references DB, state, helpers)
      8. app.js           — entry point: state, render engine, boot (must be last)
  -->
  <script src="js/db.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/pages-patient.js"></script>
  <script src="js/pages-doctor.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
